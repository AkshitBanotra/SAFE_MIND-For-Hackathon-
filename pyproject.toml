[project]
name = "sih-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cyber_Drifter", email = "akshitbanotra4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "faster-whisper>=1.2.1",
    "ipython>=9.17.1",
    "kokoro>=0.9.4",
    "requests>=2.34.2",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
sih-project = "sih_project:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
